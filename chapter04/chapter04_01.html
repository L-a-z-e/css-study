<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CSS Grid Example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } /* border-box 는 padding 과 margin을 모두 포함한 크기를 따지며 크기 계산에 용이한 장점이 있음*/
    body { font-family: sans-serif; padding: 20px; }

    .grid-container {
      display: grid; /* ✨ Grid Container로 만듦 */
      /* 3개의 동일한 너비의 열 (사용 가능한 공간을 1:1:1로 나눔) */
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
      /* 2개의 행 정의: 첫 행은 100px, 두 번째 행은 내용만큼(auto) */
      grid-template-rows: 100px auto;
      /* 행과 열 사이 간격 */
      gap: 30px;
      row-gap: 100px;
      column-gap: 10px;

      border: 2px solid dodgerblue;
      background-color: #eee;
      padding: 10px;
    }

    .grid-item {
      background-color: lightcoral;
      color: white;
      border: 1px solid tomato;
      padding: 20px;
      font-size: 1.2em; /* 상대적인 단위인데 부모 기준 */
      text-align: center;
    }

    /* --- 아이템 배치 예시 --- */
    .item1 {
      /* 기본 배치: 첫 번째 셀 (1행 1열) */
      background-color: limegreen;
    }

    .item2 {
      /* 1행 2열에서 시작해서 2개 열을 차지 (2열, 3열) */
      /* span 키워드 있을 때 없을 때 차이 -> 2/4 => 2부터 4전까지 <-> 2 / span 4 ; 2부터 4칸 */
      grid-column: 2 / span 3;
      background-color: gold;
    }

    .item3 {
      /* 2행 1열에서 시작 (기본 1개 행/열 차지) */
      /*grid-row: 1;*/
      /*grid-column: 3;*/
      grid-area: 1 / 3 / 2 / 4;
    }

    .item4 {
      /* 2행 2열에서 시작해서 3행 전까지 (즉, 2행만),
         2열에서 시작해서 4열 전까지 (즉, 2, 3열 차지) */
      grid-area: 2 / 2 / 3 / 4;
      background-color: mediumpurple;
      height: 200px;
    }

  </style>
</head>
<body>

<h1>CSS Grid 기본 예제</h1>

<div class="grid-container">
  <div class="grid-item item1">Item 1</div>
  <div class="grid-item item2">Item 2 (span 2 columns)</div>
  <div class="grid-item item3">Item 3</div>
  <div class="grid-item item4">Item 4 (area: 2/2/3/4)</div>
  <!-- Item 5, 6 등 추가 가능 (남는 셀에 자동 배치됨) -->
  <div class="grid-item">Item 5</div>
  <div class="grid-item">Item 6</div>
  <div class="grid-item item7">Item 7</div>
</div>

</body>
</html>
