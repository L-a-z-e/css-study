<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sticky Left/Right Example</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 20px; }

    .horizontal-container {
      width: 80%; /* 화면 너비보다 작게 설정 */
      max-width: 600px; /* 최대 너비 제한 (선택 사항) */
      overflow-x: scroll; /* ✨ 중요: 수평 스크롤 가능하게 함 */
      border: 2px solid blue;
      padding: 10px;
      background-color: #f0f0f0;
      display: flex; /* 내부 아이템들을 가로로 배치 */
      height: 200px; /* 높이 지정 (내용 확인용) */
    }

    .item {
      min-width: 150px; /* 각 아이템의 최소 너비 */
      height: 100%;
      border: 1px solid #ccc;
      background-color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      margin-right: 10px; /* 아이템 간 간격 */
    }

    .item:last-child {
      margin-right: 0;
    }

    .sticky-left {
      position: sticky;
      left: 0; /* ✨ 왼쪽 가장자리에 닿으면 고정 */
      background-color: lightcoral;
      color: white;
      z-index: 10; /* 다른 아이템보다 위에 오도록 */
      border-left: 3px solid red; /* 고정되는 것을 시각적으로 강조 */
    }

    .sticky-right {
      position: sticky;
      right: 0; /* ✨ 오른쪽 가장자리에 닿으면 고정 */
      background-color: lightskyblue;
      color: white;
      z-index: 10;
      border-right: 3px solid blue;
    }

  </style>
</head>
<body>

<h1>Sticky Left/Right 확인하기</h1>
<p>아래 파란색 테두리 박스 안에서 <strong>수평으로 스크롤</strong>해보세요.</p>

<div class="horizontal-container">
  <div class="item sticky-left">Sticky Left (Item 1)</div>
  <div class="item">Item 2</div>
  <div class="item">Item 3</div>
  <div class="item">Item 4</div>
  <div class="item">Item 5</div>
  <div class="item sticky-right">Sticky Right (Item 6)</div>
  <div class="item">Item 7</div>
  <div class="item">Item 8</div>
</div>

<p style="margin-top: 20px;">컨테이너 바깥 영역</p>

</body>
</html>
